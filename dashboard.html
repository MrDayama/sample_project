<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0f17" />
  <title>マイダッシュボード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #0d0f17;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hov: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.08);
      --border-hov: rgba(255, 255, 255, 0.18);
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --accent3: #ff6b6b;
      --accent4: #ffd166;
      --text-primary: #f0f0f8;
      --text-muted: #7a7c96;
      --text-dim: #4a4c6a;
      --glow: 0 0 30px rgba(108, 99, 255, 0.25);
      --radius: 16px;
      --radius-sm: 10px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Background Animated Blobs ───────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(108, 99, 255, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(0, 212, 170, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 60% 10%, rgba(255, 107, 107, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Layout ───────────────────────────────────────── */
    .app {
      position: relative;
      z-index: 1;
    }

    /* ─── Header ───────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 15, 23, 0.85);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .header-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: right;
    }

    #clock-time {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-primary);
      display: block;
    }

    /* ─── Main Grid ────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 20px;
      padding: 28px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ─── Card Base ────────────────────────────────────── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      padding: 24px;
      transition: border-color 0.3s, transform 0.2s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity 0.3s;
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.05), transparent);
      pointer-events: none;
    }

    .card:hover {
      border-color: var(--border-hov);
      transform: translateY(-2px);
      box-shadow: var(--glow);
    }

    .card:hover::after {
      opacity: 1;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .icon-purple {
      background: rgba(108, 99, 255, 0.2);
      color: var(--accent);
    }

    .icon-teal {
      background: rgba(0, 212, 170, 0.2);
      color: var(--accent2);
    }

    .icon-red {
      background: rgba(255, 107, 107, 0.2);
      color: var(--accent3);
    }

    .icon-yellow {
      background: rgba(255, 209, 102, 0.2);
      color: var(--accent4);
    }

    /* ─── Grid Placement ───────────────────────────────── */
    .card-github {
      grid-column: 1 / 3;
    }

    .card-calendar {
      grid-column: 3 / 4;
      grid-row: 1 / 3;
    }

    .card-todo {
      grid-column: 1 / 2;
    }

    .card-memo {
      grid-column: 2 / 3;
    }

    /* ═══════════════════════════════════════════════════ */
    /* GitHub Card */
    /* ═══════════════════════════════════════════════════ */

    .github-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .github-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--border-hov);
      object-fit: cover;
      background: var(--bg-card-hov);
    }

    .github-avatar-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .github-info h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .github-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .github-stats {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }

    .github-stat {
      display: flex;
      flex-direction: column;
    }

    .github-stat span:first-child {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .github-stat span:last-child {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Contribution Graph */
    .contrib-section {
      margin-top: 4px;
    }

    .contrib-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    #contrib-graph {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      grid-auto-flow: column;
      gap: 3px;
      overflow-x: auto;
    }

    .contrib-cell {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.05);
      transition: transform 0.1s;
      cursor: default;
      position: relative;
    }

    .contrib-cell:hover {
      transform: scale(1.4);
      z-index: 10;
    }

    .contrib-cell[data-level="1"] {
      background: rgba(108, 99, 255, 0.25);
    }

    .contrib-cell[data-level="2"] {
      background: rgba(108, 99, 255, 0.5);
    }

    .contrib-cell[data-level="3"] {
      background: rgba(108, 99, 255, 0.75);
    }

    .contrib-cell[data-level="4"] {
      background: rgba(108, 99, 255, 1);
    }

    /* Recent Repos */
    .repo-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .repo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      transition: background 0.2s, border-color 0.2s;
      text-decoration: none;
      color: inherit;
    }

    .repo-item:hover {
      background: var(--bg-card-hov);
      border-color: var(--border-hov);
    }

    .repo-name {
      font-weight: 500;
      color: var(--accent);
    }

    .repo-desc {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .repo-lang {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .lang-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .github-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .github-input-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .github-input-row input:focus {
      border-color: var(--accent);
    }

    .github-input-row input::placeholder {
      color: var(--text-dim);
    }

    /* ═══════════════════════════════════════════════════ */
    /* Calendar Card */
    /* ═══════════════════════════════════════════════════ */

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .cal-nav button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-nav button:hover {
      background: var(--bg-card-hov);
      border-color: var(--border-hov);
    }

    #cal-month-label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day-label {
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-dim);
      font-weight: 600;
      padding: 4px 0;
      letter-spacing: 0.5px;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      position: relative;
    }

    .cal-day:hover {
      background: var(--bg-card-hov);
    }

    .cal-day.other-month {
      color: var(--text-dim);
    }

    .cal-day.today {
      background: linear-gradient(135deg, var(--accent), #8b84ff);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 3px 12px rgba(108, 99, 255, 0.4);
    }

    .cal-day.has-event::after {
      content: '';
      position: absolute;
      bottom: 3px;
      width: 4px;
      height: 4px;
      background: var(--accent2);
      border-radius: 50%;
    }

    .cal-day.selected {
      background: rgba(108, 99, 255, 0.2);
      border: 1px solid var(--accent);
    }

    /* Events List */
    .events-section {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .events-section h4 {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .event-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }

    .event-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .event-text {
      flex: 1;
    }

    .event-date {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .add-event-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .add-event-form input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      color: var(--text-primary);
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-event-form input:focus {
      border-color: var(--accent2);
    }

    .add-event-form input::placeholder {
      color: var(--text-dim);
    }

    /* ═══════════════════════════════════════════════════ */
    /* Todo Card */
    /* ═══════════════════════════════════════════════════ */

    .todo-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .todo-input-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .todo-input-row input:focus {
      border-color: var(--accent);
    }

    .todo-input-row input::placeholder {
      color: var(--text-dim);
    }

    .todo-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .filter-btn {
      font-size: 0.72rem;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .todo-list::-webkit-scrollbar {
      width: 4px;
    }

    .todo-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .todo-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 99px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .todo-item:hover {
      background: var(--bg-card-hov);
    }

    .todo-check {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-hov);
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      background: none;
    }

    .todo-check.done {
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-check.done::after {
      content: '✓';
      color: #fff;
      font-size: 0.7rem;
    }

    .todo-text {
      flex: 1;
      font-size: 0.85rem;
    }

    .todo-text.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .todo-priority {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .todo-del {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px;
      transition: color 0.2s;
      opacity: 0;
    }

    .todo-item:hover .todo-del {
      opacity: 1;
    }

    .todo-del:hover {
      color: var(--accent3);
    }

    .priority-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .todo-footer {
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* ═══════════════════════════════════════════════════ */
    /* Memo Card */
    /* ═══════════════════════════════════════════════════ */

    .memo-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .memo-tab {
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .memo-tab.active {
      background: rgba(0, 212, 170, 0.15);
      border-color: var(--accent2);
      color: var(--accent2);
    }

    .memo-tab .del-tab {
      display: none;
      font-size: 0.7rem;
    }

    .memo-tab.active .del-tab {
      display: inline;
    }

    .memo-tab.add-tab {
      border-style: dashed;
    }

    .memo-editor {
      width: 100%;
      height: 220px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.6;
    }

    .memo-editor:focus {
      border-color: var(--accent2);
    }

    .memo-editor::placeholder {
      color: var(--text-dim);
    }

    .memo-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    /* ─── Button ───────────────────────────────────────── */
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.82rem;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b84ff);
      color: #fff;
      box-shadow: 0 3px 12px rgba(108, 99, 255, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 18px rgba(108, 99, 255, 0.5);
    }

    .btn-primary:active {
      transform: none;
    }

    .btn-teal {
      background: linear-gradient(135deg, var(--accent2), #00b894);
      color: #000;
      box-shadow: 0 3px 12px rgba(0, 212, 170, 0.3);
      font-weight: 600;
    }

    .btn-teal:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 18px rgba(0, 212, 170, 0.4);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.78rem;
    }

    /* ─── Toast ────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: rgba(30, 32, 50, 0.95);
      border: 1px solid var(--border-hov);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.85rem;
      backdrop-filter: blur(16px);
      z-index: 999;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* ─── Scrollbar ────────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 99px;
    }

    /* ─── Responsive: Tablet ──────────────────────────── */
    @media (max-width: 1100px) {
      .grid {
        grid-template-columns: 1fr 1fr;
        padding: 20px 20px;
      }

      .card-github {
        grid-column: 1 / 3;
      }

      .card-calendar {
        grid-column: 1 / 2;
        grid-row: auto;
      }

      .card-todo {
        grid-column: 2 / 3;
      }

      .card-memo {
        grid-column: 1 / 3;
      }
    }

    /* ─── Bottom Nav (mobile only) ────────────────────── */
    .bottom-nav {
      display: none;
    }

    /* ─── Responsive: Mobile ──────────────────────────── */
    @media (max-width: 640px) {

      /* Header */
      header {
        padding: 12px 16px;
        padding-top: calc(12px + env(safe-area-inset-top));
      }

      .logo {
        font-size: 1rem;
      }

      .logo-icon {
        width: 30px;
        height: 30px;
        font-size: 0.85rem;
      }

      #clock-time {
        font-size: 1.1rem;
      }

      #clock-date {
        font-size: 0.7rem;
      }

      /* Grid → single panel */
      .grid {
        display: block;
        padding: 14px 14px;
        padding-bottom: calc(80px + env(safe-area-inset-bottom));
      }

      /* All cards hidden by default on mobile */
      .card-github,
      .card-calendar,
      .card-todo,
      .card-memo {
        display: none;
        grid-column: 1;
        grid-row: auto;
      }

      /* Active card shown */
      .card-github.mobile-active,
      .card-calendar.mobile-active,
      .card-todo.mobile-active,
      .card-memo.mobile-active {
        display: block;
        animation: fadeInCard 0.25s ease;
      }

      @keyframes fadeInCard {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Card tweaks */
      .card {
        padding: 16px;
      }

      .card-header {
        margin-bottom: 14px;
      }

      /* GitHub */
      .github-input-row {
        flex-wrap: wrap;
      }

      .github-input-row input {
        min-width: 0;
      }

      .github-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .github-stats {
        gap: 20px;
      }

      #contrib-graph {
        gap: 2px;
      }

      .contrib-cell {
        width: 9px;
        height: 9px;
      }

      /* Calendar */
      .cal-day {
        font-size: 0.85rem;
        border-radius: 6px;
      }

      .add-event-form button {
        width: 100%;
      }

      /* Todo */
      .todo-input-row {
        flex-wrap: wrap;
      }

      .todo-input-row input {
        width: 100%;
      }

      .todo-check {
        width: 22px;
        height: 22px;
      }

      .todo-del {
        opacity: 1 !important;
      }

      .todo-list {
        max-height: 50vh;
      }

      /* Memo */
      .memo-editor {
        height: 50vh;
      }

      /* Bottom Nav */
      .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding-bottom: env(safe-area-inset-bottom);
        background: rgba(13, 15, 23, 0.92);
        backdrop-filter: blur(20px);
        border-top: 1px solid var(--border);
        z-index: 200;
      }

      .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px 4px 12px;
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        transition: color 0.2s;
        font-family: 'Inter', sans-serif;
        gap: 4px;
        -webkit-tap-highlight-color: transparent;
      }

      .nav-item.active {
        color: var(--accent);
      }

      .nav-icon {
        font-size: 1.3rem;
        line-height: 1;
      }

      .nav-label {
        font-size: 0.65rem;
        font-weight: 500;
        letter-spacing: 0.3px;
      }

      .nav-badge {
        position: absolute;
        top: 6px;
        background: var(--accent3);
        color: #fff;
        font-size: 0.6rem;
        font-weight: 700;
        min-width: 16px;
        height: 16px;
        border-radius: 99px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
      }

      .nav-item {
        position: relative;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- ── Header ──────────────────────────────────────── -->
    <header>
      <div class="logo">
        <div class="logo-icon">⚡</div>
        マイダッシュボード
      </div>
      <div class="header-clock">
        <span id="clock-time">00:00:00</span>
        <span id="clock-date"></span>
      </div>
    </header>

    <!-- ── Main Grid ───────────────────────────────────── -->
    <main class="grid">

      <!-- ── GitHub Card ────────────────────────────────── -->
      <section class="card card-github" id="github-card">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon icon-purple">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
              </svg>
            </div>
            GitHub
          </div>
          <div class="github-input-row" style="margin-bottom:0; flex:0 0 auto;">
            <input type="text" id="gh-username" placeholder="ユーザー名" style="width:140px;" />
            <button class="btn btn-primary btn-sm" onclick="fetchGitHub()">取得</button>
          </div>
        </div>

        <!-- Profile -->
        <div class="github-top" id="gh-profile" style="display:none;">
          <img class="github-avatar" id="gh-avatar" src="" alt="avatar" />
          <div class="github-info">
            <h2 id="gh-name"></h2>
            <p id="gh-bio"></p>
            <div class="github-stats">
              <div class="github-stat">
                <span id="gh-repos">-</span><span>リポジトリ</span>
              </div>
              <div class="github-stat">
                <span id="gh-followers">-</span><span>フォロワー</span>
              </div>
              <div class="github-stat">
                <span id="gh-following">-</span><span>フォロー中</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Contribution Graph -->
        <div class="contrib-section">
          <div class="contrib-label">コントリビューション活動（過去52週間）</div>
          <div id="contrib-graph"></div>
        </div>

        <!-- Recent Repos -->
        <div class="repo-list" id="repo-list"></div>
      </section>

      <!-- ── Calendar Card ──────────────────────────────── -->
      <section class="card card-calendar">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon icon-teal">📅</div>
            カレンダー
          </div>
        </div>

        <div class="cal-nav">
          <button onclick="calPrev()">‹</button>
          <span id="cal-month-label"></span>
          <button onclick="calNext()">›</button>
        </div>

        <div class="cal-grid" id="cal-grid"></div>

        <div class="events-section">
          <h4>📌 イベント</h4>
          <div id="event-list"></div>
          <div class="add-event-form">
            <input type="text" id="new-event-name" placeholder="イベント名..." />
            <input type="date" id="new-event-date" />
            <button class="btn btn-teal btn-sm" onclick="addEvent()" style="margin-top:2px;">追加</button>
          </div>
        </div>
      </section>

      <!-- ── Todo Card ──────────────────────────────────── -->
      <section class="card card-todo">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon icon-red">✅</div>
            タスク管理
          </div>
          <span id="todo-count" style="font-size:0.75rem; color:var(--text-muted);"></span>
        </div>

        <div class="todo-input-row">
          <input type="text" id="todo-input" placeholder="新しいタスクを追加..." onkeydown="if(event.key==='Enter')addTodo()" />
          <select class="priority-select" id="todo-priority">
            <option value="high">🔴</option>
            <option value="mid" selected>🟡</option>
            <option value="low">🟢</option>
          </select>
          <button class="btn btn-primary btn-sm" onclick="addTodo()">追加</button>
        </div>

        <div class="todo-filters">
          <button class="filter-btn active" onclick="setFilter('all', this)">すべて</button>
          <button class="filter-btn" onclick="setFilter('active', this)">未完了</button>
          <button class="filter-btn" onclick="setFilter('done', this)">完了</button>
        </div>

        <div class="todo-list" id="todo-list"></div>

        <div class="todo-footer" id="todo-footer"></div>
      </section>

      <!-- ── Memo Card ──────────────────────────────────── -->
      <section class="card card-memo">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon icon-yellow">📝</div>
            メモ
          </div>
          <button class="btn btn-teal btn-sm" onclick="saveMemo()">💾 保存</button>
        </div>

        <div class="memo-tabs" id="memo-tabs"></div>

        <textarea id="memo-editor" class="memo-editor" placeholder="ここにメモを書いてください...&#10;&#10;Markdown形式でも書けます ✨"
          oninput="onMemoInput()"></textarea>

        <div class="memo-footer">
          <span id="memo-char-count">0文字</span>
          <span id="memo-saved-time"></span>
        </div>
      </section>

    </main>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Bottom Nav (mobile) -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" id="nav-github" onclick="switchTab('github')">
      <span class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
        </svg>
      </span>
      <span class="nav-label">GitHub</span>
    </button>
    <button class="nav-item" id="nav-calendar" onclick="switchTab('calendar')">
      <span class="nav-icon">📅</span>
      <span class="nav-label">カレンダー</span>
    </button>
    <button class="nav-item" id="nav-todo" onclick="switchTab('todo')">
      <span class="nav-icon">✅</span>
      <span class="nav-label">タスク</span>
      <span class="nav-badge" id="nav-badge-todo" style="display:none"></span>
    </button>
    <button class="nav-item" id="nav-memo" onclick="switchTab('memo')">
      <span class="nav-icon">📝</span>
      <span class="nav-label">メモ</span>
    </button>
  </nav>

  <script>
    // ═══════════════════════════════════════════════════════
    // Mobile Tab Navigation
    // ═══════════════════════════════════════════════════════
    const TAB_MAP = {
      github: 'github-card',
      calendar: document.querySelector('.card-calendar'),
      todo: document.querySelector('.card-todo'),
      memo: document.querySelector('.card-memo'),
    };

    const cardClasses = {
      github: '.card-github',
      calendar: '.card-calendar',
      todo: '.card-todo',
      memo: '.card-memo',
    };

    let currentTab = 'github';

    function isMobile() {
      return window.matchMedia('(max-width: 640px)').matches;
    }

    function switchTab(tab) {
      if (!isMobile()) return;
      currentTab = tab;

      // Update cards
      Object.keys(cardClasses).forEach(key => {
        const el = document.querySelector(cardClasses[key]);
        if (!el) return;
        el.classList.toggle('mobile-active', key === tab);
      });

      // Update nav buttons
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('nav-' + tab);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function initMobileLayout() {
      if (isMobile()) {
        switchTab('github');
      } else {
        // Desktop: show all cards
        document.querySelectorAll('.card-github,.card-calendar,.card-todo,.card-memo')
          .forEach(el => el.classList.remove('mobile-active'));
      }
    }

    // Init on load + resize
    initMobileLayout();
    window.addEventListener('resize', initMobileLayout);

    // Update todo badge
    function updateTodoBadge() {
      const badge = document.getElementById('nav-badge-todo');
      if (!badge) return;
      const active = (window.todos || []).filter(t => !t.done).length;
      badge.textContent = active;
      badge.style.display = active > 0 ? 'flex' : 'none';
    }

    // ═══════════════════════════════════════════════════════
    // Utils
    // ═══════════════════════════════════════════════════════
    const save = (k, v) => localStorage.setItem('dash_' + k, JSON.stringify(v));
    const load = (k, d) => { try { return JSON.parse(localStorage.getItem('dash_' + k)) ?? d; } catch { return d; } };

    function toast(msg, duration = 2500) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove('show'), duration);
    }

    // ═══════════════════════════════════════════════════════
    // Clock
    // ═══════════════════════════════════════════════════════
    function updateClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent =
        now.toLocaleTimeString('ja-JP', { hour12: false });
      document.getElementById('clock-date').textContent =
        now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ═══════════════════════════════════════════════════════
    // GitHub
    // ═══════════════════════════════════════════════════════
    const langColors = { JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5', HTML: '#e34c26', CSS: '#563d7c', Rust: '#dea584', Go: '#00ADD8', Java: '#b07219', Ruby: '#701516', Swift: '#F05138', Kotlin: '#A97BFF', C: '#555555', 'C++': '#f34b7d', 'C#': '#178600', Shell: '#89e051', Dockerfile: '#384d54', Vue: '#41b883', Svelte: '#ff3e00', default: 'var(--text-muted)' };

    async function fetchGitHub() {
      const username = document.getElementById('gh-username').value.trim();
      if (!username) { toast('⚠ ユーザー名を入力してください'); return; }
      save('gh_user', username);

      try {
        toast('⏳ GitHub情報を取得中...');
        const [user, repos] = await Promise.all([
          fetch(`https://api.github.com/users/${username}`).then(r => r.json()),
          fetch(`https://api.github.com/users/${username}/repos?sort=pushed&per_page=4`).then(r => r.json())
        ]);

        if (user.message === 'Not Found') { toast('❌ ユーザーが見つかりません'); return; }

        // Profile
        document.getElementById('gh-profile').style.display = 'flex';
        document.getElementById('gh-avatar').src = user.avatar_url;
        document.getElementById('gh-name').textContent = user.name || user.login;
        document.getElementById('gh-bio').textContent = user.bio || user.login + ' on GitHub';
        document.getElementById('gh-repos').textContent = user.public_repos;
        document.getElementById('gh-followers').textContent = user.followers;
        document.getElementById('gh-following').textContent = user.following;

        // Repos
        const repoList = document.getElementById('repo-list');
        repoList.innerHTML = '';
        (Array.isArray(repos) ? repos : []).slice(0, 4).forEach(repo => {
          const color = langColors[repo.language] || langColors.default;
          const item = document.createElement('a');
          item.className = 'repo-item';
          item.href = repo.html_url;
          item.target = '_blank';
          item.innerHTML = `
        <div>
          <div class="repo-name">${repo.name}</div>
          <div class="repo-desc">${repo.description || '説明なし'}</div>
        </div>
        <div class="repo-lang">
          <span class="lang-dot" style="background:${color}"></span>
          ${repo.language || 'N/A'} · ⭐ ${repo.stargazers_count}
        </div>`;
          repoList.appendChild(item);
        });

        toast('✅ GitHub情報を更新しました！');
      } catch (e) {
        toast('❌ 取得失敗: ' + e.message);
      }
    }

    // Demo Contribution Graph
    function renderContribGraph() {
      const graph = document.getElementById('contrib-graph');
      graph.innerHTML = '';
      const weeks = 52;
      for (let w = 0; w < weeks; w++) {
        for (let d = 0; d < 7; d++) {
          const cell = document.createElement('div');
          cell.className = 'contrib-cell';
          const r = Math.random();
          const level = r < 0.35 ? 0 : r < 0.55 ? 1 : r < 0.72 ? 2 : r < 0.87 ? 3 : 4;
          if (level > 0) cell.dataset.level = level;
          cell.title = `${level > 0 ? level + ' contributions' : 'No contributions'}`;
          graph.appendChild(cell);
        }
      }
    }
    renderContribGraph();

    // Restore saved username
    const savedUser = load('gh_user', '');
    if (savedUser) {
      document.getElementById('gh-username').value = savedUser;
      fetchGitHub();
    }

    // ═══════════════════════════════════════════════════════
    // Calendar
    // ═══════════════════════════════════════════════════════
    let calNow = new Date();
    let calYear = calNow.getFullYear();
    let calMonth = calNow.getMonth();
    let calSelected = null;
    let events = load('events', []);

    const DAYS_JA = ['日', '月', '火', '水', '木', '金', '土'];
    const MONTHS_COLORS = ['#6c63ff', '#00d4aa', '#ff6b6b', '#ffd166', '#a8e6cf', '#ff9a9e', '#a1c4fd', '#ffecd2', '#d4fc79', '#96fbc4', '#89f7fe', '#bcbcbc'];

    function renderCalendar() {
      const label = document.getElementById('cal-month-label');
      label.textContent = `${calYear}年 ${calMonth + 1}月`;

      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';

      // Day labels
      DAYS_JA.forEach(d => {
        const el = document.createElement('div');
        el.className = 'cal-day-label';
        el.textContent = d;
        grid.appendChild(el);
      });

      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const daysInPrev = new Date(calYear, calMonth, 0).getDate();

      // Prev month
      for (let i = firstDay - 1; i >= 0; i--) {
        appendDay(grid, daysInPrev - i, true, false, false);
      }

      // Current month
      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = d === calNow.getDate() && calMonth === calNow.getMonth() && calYear === calNow.getFullYear();
        const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const hasEvent = events.some(e => e.date === dateStr);
        const isSelected = calSelected === dateStr;
        appendDay(grid, d, false, isToday, hasEvent, isSelected, dateStr);
      }

      // Next month fill
      const total = firstDay + daysInMonth;
      const remaining = Math.ceil(total / 7) * 7 - total;
      for (let i = 1; i <= remaining; i++) {
        appendDay(grid, i, true, false, false);
      }

      renderEvents();
    }

    function appendDay(grid, num, otherMonth, isToday, hasEvent, isSelected, dateStr) {
      const el = document.createElement('div');
      el.className = 'cal-day' +
        (otherMonth ? ' other-month' : '') +
        (isToday ? ' today' : '') +
        (hasEvent ? ' has-event' : '') +
        (isSelected ? ' selected' : '');
      el.textContent = num;
      if (dateStr) {
        el.onclick = () => { calSelected = (calSelected === dateStr ? null : dateStr); renderCalendar(); };
      }
      grid.appendChild(el);
    }

    function renderEvents() {
      const ul = document.getElementById('event-list');
      ul.innerHTML = '';
      const sorted = [...events].sort((a, b) => a.date.localeCompare(b.date));
      sorted.forEach((ev, i) => {
        const d = document.createElement('div');
        d.className = 'event-item';
        const color = MONTHS_COLORS[i % MONTHS_COLORS.length];
        d.innerHTML = `
      <div class="event-dot" style="background:${color}"></div>
      <div class="event-text">
        <div>${ev.name}</div>
        <div class="event-date">${ev.date}</div>
      </div>
      <button class="todo-del" onclick="deleteEvent(${i})" style="opacity:1;">✕</button>`;
        ul.appendChild(d);
      });
      if (sorted.length === 0) {
        ul.innerHTML = '<div style="font-size:0.8rem;color:var(--text-dim);padding:6px 0;">イベントなし</div>';
      }
    }

    function addEvent() {
      const name = document.getElementById('new-event-name').value.trim();
      const date = document.getElementById('new-event-date').value;
      if (!name || !date) { toast('⚠ 名前と日付を入力してください'); return; }
      events.push({ name, date });
      save('events', events);
      document.getElementById('new-event-name').value = '';
      document.getElementById('new-event-date').value = '';
      renderCalendar();
      toast('📅 イベントを追加しました！');
    }

    function deleteEvent(idx) {
      events.splice(idx, 1);
      save('events', events);
      renderCalendar();
    }

    function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
    function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }

    renderCalendar();

    // ═══════════════════════════════════════════════════════
    // Todo
    // ═══════════════════════════════════════════════════════
    let todos = load('todos', []);
    let todoFilter = 'all';

    const priorityColor = { high: '#ff6b6b', mid: '#ffd166', low: '#6bcb77' };

    function renderTodos() {
      const list = document.getElementById('todo-list');
      let filtered = todos;
      if (todoFilter === 'active') filtered = todos.filter(t => !t.done);
      if (todoFilter === 'done') filtered = todos.filter(t => t.done);

      list.innerHTML = '';
      if (filtered.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px 0;font-size:0.85rem;">タスクがありません 🎉</div>';
      } else {
        filtered.forEach(t => {
          const item = document.createElement('div');
          item.className = 'todo-item';
          item.innerHTML = `
        <div class="todo-check ${t.done ? 'done' : ''}" onclick="toggleTodo('${t.id}')"></div>
        <span class="todo-priority" style="background:${priorityColor[t.priority] || '#888'}"></span>
        <span class="todo-text ${t.done ? 'done' : ''}">${escHtml(t.text)}</span>
        <button class="todo-del" onclick="deleteTodo('${t.id}')">✕</button>`;
          list.appendChild(item);
        });
      }

      const active = todos.filter(t => !t.done).length;
      document.getElementById('todo-count').textContent = `${active}件残り`;
      document.getElementById('todo-footer').textContent = `全${todos.length}件 · 完了${todos.filter(t => t.done).length}件`;
      window.todos = todos;
      updateTodoBadge();
    }

    function addTodo() {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) { toast('⚠ タスクを入力してください'); return; }
      const priority = document.getElementById('todo-priority').value;
      todos.unshift({ id: Date.now().toString(), text, done: false, priority, created: Date.now() });
      save('todos', todos);
      input.value = '';
      renderTodos();
      toast('✅ タスクを追加しました！');
    }

    function toggleTodo(id) {
      const t = todos.find(t => t.id === id);
      if (t) { t.done = !t.done; save('todos', todos); renderTodos(); }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      save('todos', todos);
      renderTodos();
    }

    function setFilter(f, btn) {
      todoFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTodos();
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    renderTodos();

    // ═══════════════════════════════════════════════════════
    // Memo
    // ═══════════════════════════════════════════════════════
    let memos = load('memos', [{ id: 'default', name: 'メモ1', content: '' }]);
    let activeMemoId = memos[0]?.id || 'default';

    function renderMemoTabs() {
      const tabs = document.getElementById('memo-tabs');
      tabs.innerHTML = '';

      memos.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'memo-tab' + (m.id === activeMemoId ? ' active' : '');
        btn.innerHTML = `${m.name} <span class="del-tab" onclick="deleteMemoTab('${m.id}', event)">✕</span>`;
        btn.onclick = (e) => { if (e.target.classList.contains('del-tab')) return; switchMemo(m.id); };
        tabs.appendChild(btn);
      });

      const add = document.createElement('button');
      add.className = 'memo-tab add-tab';
      add.textContent = '+ 新規';
      add.onclick = addMemoTab;
      tabs.appendChild(add);
    }

    function switchMemo(id) {
      activeMemoId = id;
      const m = memos.find(m => m.id === id);
      document.getElementById('memo-editor').value = m ? m.content : '';
      updateMemoCounter();
      renderMemoTabs();
    }

    function addMemoTab() {
      const name = prompt('メモ名を入力:') || `メモ${memos.length + 1}`;
      const id = Date.now().toString();
      memos.push({ id, name, content: '' });
      save('memos', memos);
      switchMemo(id);
    }

    function deleteMemoTab(id, e) {
      e.stopPropagation();
      if (memos.length === 1) { toast('⚠ 最後のメモは削除できません'); return; }
      memos = memos.filter(m => m.id !== id);
      save('memos', memos);
      if (activeMemoId === id) switchMemo(memos[0].id);
      else renderMemoTabs();
    }

    function onMemoInput() {
      const m = memos.find(m => m.id === activeMemoId);
      if (m) m.content = document.getElementById('memo-editor').value;
      updateMemoCounter();
    }

    function updateMemoCounter() {
      const val = document.getElementById('memo-editor').value;
      document.getElementById('memo-char-count').textContent = `${val.length}文字`;
    }

    function saveMemo() {
      save('memos', memos);
      const now = new Date().toLocaleTimeString('ja-JP');
      document.getElementById('memo-saved-time').textContent = `保存済み ${now}`;
      toast('💾 メモを保存しました！');
    }

    // Auto-save every 30s
    setInterval(() => { save('memos', memos); }, 30000);

    // Init memo
    renderMemoTabs();
    switchMemo(activeMemoId);
  </script>
</body>

</html>
